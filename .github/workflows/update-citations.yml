name: Update citations from Google Scholar

# Keeps _data/citations.csv up to date automatically instead of manually
# downloading, editing, and re-uploading a CSV export from Google Scholar.
#
# Setup:
#   1. Set the repository variable SCHOLAR_ID to the 'user=' value from your
#      Google Scholar profile URL, e.g.
#      https://scholar.google.com/citations?user=<SCHOLAR_ID>
#      (Settings > Secrets and variables > Actions > Variables).
#   2. That's it — the workflow runs weekly and can also be triggered
#      manually from the Actions tab.
#
# How it works:
#   - scripts/update_citations.py scrapes the Scholar profile with the free
#     'scholarly' package and merges the results into _data/citations.csv,
#     matching existing rows by (normalized) title. Manually curated fields
#     such as DOI, PDF, Code, URL and BibTeX links are never overwritten; only
#     non-empty Scholar-derived fields (Authors, Publication, Volume, Number,
#     Pages, Year, Publisher) are refreshed, and new publications are appended.
#   - If the CSV changes, the workflow commits the update to the branch from
#     which it runs. This avoids requiring the repository setting that allows
#     the GitHub Actions token to create pull requests.
#
# Note: Google Scholar has no official API and can rate-limit or block
# scraping. If this workflow becomes unreliable, swap the fetch step in
# scripts/update_citations.py for a service such as SerpApi's Google
# Scholar Author API (paid, but far more reliable) — the CSV merge/write
# logic does not need to change.

on:
  schedule:
    - cron: "0 6 * * 1" # Every Monday at 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-citations:
    runs-on: ubuntu-latest
    env:
      # Use the repository variable when configured, otherwise use Michael
      # Burke's public Google Scholar profile.
      SCHOLAR_ID: ${{ vars.SCHOLAR_ID || 'Abz56f4AAAAJ' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Check Scholar ID configuration
        if: ${{ env.SCHOLAR_ID == '' }}
        run: |
          echo "::warning::Repository variable SCHOLAR_ID is not configured; skipping citation update."

      - name: Update citations.csv from Google Scholar
        if: ${{ env.SCHOLAR_ID != '' }}
        run: |
          python scripts/update_citations.py \
            --scholar-id "${{ env.SCHOLAR_ID }}" \
            --csv-path _data/citations.csv

      - name: Commit citation updates
        if: ${{ env.SCHOLAR_ID != '' }}
        run: |
          if git diff --quiet -- _data/citations.csv; then
            echo "No citation updates to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/citations.csv
          git commit -m "Update citations.csv from Google Scholar"
          git push origin "HEAD:${GITHUB_REF_NAME}"
